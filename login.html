<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login - Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    height: 100vh;
    display: flex;
}

/* IZQUIERDA */
.login-section {
    width: 40%;
    background: #408A19;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    background: #2e6b12;
    padding: 30px;
    border-radius: 20px;
    width: 300px;
    color: white;
}

/* DERECHA */
.image-section {
    width: 60%;
    background: url("iniciar-sesion.jpeg") center/contain no-repeat;
    background-color: #2e6b12;
}

input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 10px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    background: #8DE35F;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin-top: 10px;
}

h2, h3 {
    text-align: center;
}

.pass-container {
    position: relative;
}

.ver-pass {
    position: absolute;
    right: 10px;
    top: 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-section">
<div class="login-box">

<h2>Iniciar Sesión</h2>

<input id="loginUser" placeholder="Usuario">

<div class="pass-container">
<input id="loginPass" type="password" placeholder="Contraseña">
<span class="ver-pass" onclick="togglePass('loginPass')">👁️</span>
</div>

<button onclick="login()">Entrar</button>

<h3>Crear cuenta</h3>

<input id="newUser" placeholder="Usuario">

<div class="pass-container">
<input id="newPass" type="password" placeholder="Contraseña">
<span class="ver-pass" onclick="togglePass('newPass')">👁️</span>
</div>

<select id="newZona">
<option value="">Zona climática</option>
<option>Árida</option>
<option>Semiárida</option>
<option>Templada</option>
<option>Húmeda</option>
<option>Tropical</option>
</select>

<button onclick="crearCuenta()">Registrar</button>

</div>
</div>

<div class="image-section"></div>

<script>
function togglePass(id){
    let input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

/* CREAR CUENTA */
function crearCuenta(){
    let user = newUser.value;
    let pass = newPass.value;
    let zona = newZona.value;

    if(!user || !pass || !zona){
        alert("Completa todos los campos");
        return;
    }

    localStorage.setItem("user", user);
    localStorage.setItem("pass", pass);
    localStorage.setItem("zonaPerfil", zona);

    alert("Cuenta creada correctamente");
}

/* LOGIN */
function login(){
    let user = loginUser.value;
    let pass = loginPass.value;

    let savedUser = localStorage.getItem("user");
    let savedPass = localStorage.getItem("pass");

    if(user === savedUser && pass === savedPass){

        /* 🔥 ESTA ES LA CLAVE */
        localStorage.setItem("sesion", user);

        window.location.href = "index.html";

    } else {
        alert("Usuario o contraseña incorrectos");
    }
}
</script>

</body>
</html>
