<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Iniciar Sesión</title>

<style>
body {
    font-family: Arial;
    background: #408A19;
    color: white;
    text-align: center;
    padding-top: 100px;
}

input {
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 10px 20px;
    background: #8DE35F;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Iniciar Sesión</h2>

<input id="user" placeholder="Usuario"><br>
<input id="pass" type="password" placeholder="Contraseña"><br>

<button onclick="login()">Entrar</button>

<h3>Crear cuenta</h3>

<input id="newUser" placeholder="Nuevo usuario"><br>
<input id="newPass" type="password" placeholder="Nueva contraseña"><br>

<button onclick="crearCuenta()">Registrar</button>

<script>
function crearCuenta() {
    localStorage.setItem("user", document.getElementById("newUser").value);
    localStorage.setItem("pass", document.getElementById("newPass").value);
    alert("Cuenta creada");
}

function login() {
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;

    let savedUser = localStorage.getItem("user");
    let savedPass = localStorage.getItem("pass");

    if(user === savedUser && pass === savedPass) {
        localStorage.setItem("sesion", user);
        window.location.href = "index.html";
    } else {
        alert("Datos incorrectos");
    }
}
</script>

</body>
</html>
