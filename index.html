<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* ===== NAV ===== */
nav{
    background:#2e6b12;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    height:50px;
    cursor:pointer;
}

.menu-links{
    display:flex;
    gap:15px;
}

.menu-links a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
    padding:6px 10px;
    border-radius:8px;
    transition:0.2s;
}

.menu-links a:hover{
    background:rgba(255,255,255,0.2);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
    cursor:pointer;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

/* ===== SECCIONES ===== */
.section {
    display: none;
    padding: 30px;
}

.active {
    display: block;
}

/* ===== HERO ===== */
.hero {
    display: flex;
    justify-content: center;
}

.hero img {
    max-width: 90%;
    border-radius: 20px;
}

/* ===== PERFIL ===== */
.perfil-container {
    position: relative;
}

.icono {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    background: #2e6b12;
    min-width: 160px;
    border-radius: 8px;
    overflow: hidden;
    z-index: 999;
}

.dropdown a {
    display:block;
    padding:10px;
    color:white;
    text-decoration:none;
}

.dropdown a:hover {
    background:rgba(255,255,255,0.2);
}

.dropdown.show {
    display:block;
}

.perfil-hero{
    display:flex;
    width:90%;
    height:80vh;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    align-items:stretch;
}

/* IZQUIERDA */
.perfil-texto {
    width:30%;
    background: rgba(13,107,47,0.85);
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

/* TÍTULO */
.perfil-texto h1 {
    color:yellow;
    font-size:50px;
    margin:0;
}

/* BOTONES */
.perfil-botones-texto {
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
}

.perfil-botones-texto img {
    width: 170px;
    cursor: pointer;
    transition:0.2s;
}

.perfil-botones-texto img:hover {
    transform: scale(1.05);
}

/* DERECHA */
.perfil-imagen {
    width:70%;
    height:100%;
}

.perfil-imagen img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ===== HUERTO ===== */
.huerto-container{
    display:flex;
    width:90%;
    height:80vh;
    margin:auto;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* IZQUIERDA */
.huerto-izq{
    width:35%;
    background:#2e6b12;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:20px;
    gap:25px;
}

/* LOGO */
.huerto-logo{
    height:90px;
}

/* BOTONES */
.huerto-botones{
    display:flex;
    flex-direction:column;
    gap:15px;
    width:100%;
    align-items:center;
}

.huerto-botones img{
    width:160px;
    cursor:pointer;
    transition:0.2s;
}

.huerto-botones img:hover{
    transform: scale(1.05);
}

/* DERECHA */
.huerto-der{
    width:65%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff10;
}

/* CUADRO */
.cuadro-huerto{
    width:95%;
    height:95%;
    background:white;
    border-radius:15px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* IMAGEN */
.huerto-img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* ===== CULTIVOS ===== */
.cultivo-imagen {
    width: 90%;
    height: 75vh;
    margin: auto;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0d6b2f;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    overflow:hidden;
}

.cultivo-imagen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
/* ===== EDITAR PERFIL ===== */
.form-box{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
}

.form-card{
    background:white;
    color:black;
    padding:30px;
    border-radius:15px;
    width:320px;
    max-width:90%;
    display:flex;
    flex-direction:column;
    gap:12px;
    text-align:center;
}

.form-card input{
    padding:10px;
    border-radius:8px;
    border:none;
    outline:none;
    background:#f0f0f0;
}

.form-card button{
    padding:10px;
    background:#2e6b12;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<nav>
<div class="nav-left">
    <img src="logo.png" class="logo" onclick="mostrar('inicio')">

    <div class="menu-links">
        <a onclick="mostrar('cultivos')">Cultivos</a>
        <a onclick="mostrar('recursos')">Recursos</a>
        <a onclick="mostrar('proveedores')">Proveedores</a>
    </div>
</div>

<div class="nav-right">
    <a href="login.html" id="btnSesion" class="login-btn">Sesión</a>

    <div id="perfilMenu" class="perfil-container" style="display:none;">
        <img src="perfil.png" class="icono" onclick="toggleMenu(event)">

        <div id="dropdownMenu" class="dropdown">
            <a onclick="mostrar('editarPerfil')">Editar perfil</a>
            <a onclick="mostrar('perfil')">Mi perfil</a>
            <a onclick="mostrar('huerto')">Mi huerto</a>
            <a onclick="logout()">Cerrar sesión</a>
        </div>
    </div>
</div>
</nav>

<!-- INICIO -->
<div id="inicio" class="section active">
    <div class="hero">
        <img src="portada principal.jpeg">
    </div>
</div>

<!-- PERFIL -->
<div id="perfil" class="section">
<div class="perfil-hero">

<div class="perfil-texto">

<h1>Bienvenida, <span id="nombreBienvenida"></span> 🌱</h1>

<div class="perfil-botones-texto">

<img src="icono1.jpeg" onclick="mostrar('huerto')">
<img src="icono2.jpeg">
<img src="icono3.jpeg">

</div>

</div>

<div class="perfil-imagen">
<img src="perfil-fondo.jpeg">
</div>

</div>
</div>

<!-- EDITAR PERFIL -->
<div id="editarPerfil" class="section">
<div class="form-box">

<div class="form-card">

<h2>Editar Perfil</h2>

<input type="text" id="editUsuario" placeholder="Usuario">
<input type="password" id="editPassword" placeholder="Contraseña">
<input type="text" id="editZona" placeholder="Zona climática">

<button onclick="guardarPerfil()">Guardar cambios</button>

</div>

</div>
</div>

<!-- HUERTO -->
<div id="huerto" class="section">
<div class="huerto-container">

<div class="huerto-izq">
<img src="logo.png" class="huerto-logo">

<div class="huerto-botones">
<img src="icono4.jpeg" onclick="cambiarHuerto('icono4')">
<img src="icono2.jpeg" onclick="cambiarHuerto('icono2')">
<img src="icono3.jpeg">
</div>

</div>

<div class="huerto-der">
<div class="cuadro-huerto">
<img id="huertoMain" src="huerto.jpeg" class="huerto-img">
</div>
</div>

</div>
</div>

<!-- CULTIVOS -->
<div id="cultivos" class="section">
<div class="cultivo-imagen">
<img src="cultivos.jpeg">
</div>
</div>

<div id="recursos" class="section"><h2>Recursos</h2></div>
<div id="proveedores" class="section"><h2>Proveedores</h2></div>

<script>
function mostrar(id){
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");

    document.getElementById("dropdownMenu")?.classList.remove("show");

    // 🌿 RESET HUERTO SIEMPRE QUE SE ABRE
    if(id === "huerto"){
        document.getElementById("huertoMain").src = "huerto.jpeg";
    }
}

function toggleMenu(e){
    e.stopPropagation();
    document.getElementById("dropdownMenu").classList.toggle("show");
}

document.addEventListener("click", () => {
    document.getElementById("dropdownMenu")?.classList.remove("show");
});

/* HUERTO */
function cambiarHuerto(icono){
    const img = document.getElementById("huertoMain");

    if(icono === "icono4"){
        img.src = "actividades.jpeg";
    }

    if(icono === "icono2"){
        img.src = "recursos.jpeg";
    }
}

/* GUARDAR PERFIL */
function guardarPerfil(){
    let usuario = document.getElementById("editUsuario").value;
    let pass = document.getElementById("editPassword").value;
    let zona = document.getElementById("editZona").value;

    if(usuario){
        localStorage.setItem("sesion", usuario);
        document.getElementById("nombreBienvenida").innerText = usuario;
    }

    localStorage.setItem("password", pass);
    localStorage.setItem("zona", zona);

    alert("Perfil actualizado 🌱");
}

/* SESIÓN */
let user = localStorage.getItem("sesion");

if(user){
    document.getElementById("btnSesion").style.display="none";
    document.getElementById("perfilMenu").style.display="inline-block";
    document.getElementById("nombreBienvenida").innerText = user;
}else{
    document.getElementById("nombreBienvenida").innerText = "Invitado";
}

function logout(){
    localStorage.removeItem("sesion");
    location.reload();
}
</script>

</body>
</html>
