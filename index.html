<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Siembra Seguro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #111;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            margin: 5%;
            height: 90vh;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
        }

        .fondo {
            width: 90%;
            height: 90%;
            background: url("portada principal.jpeg") center/cover no-repeat;
        }

        .btn-login {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 25px;
            background-color: #8DE35F;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #6fc94a;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <div class="fondo"></div>
        <a href="#" class="btn-login">Iniciar sesión</a>
    </div>

</body>
</html>
