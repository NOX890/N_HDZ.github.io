<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #111;
}

/* CONTENEDOR PRINCIPAL */
.hero {
    height: 100vh;
    display: flex;
    justify-content: center; /* centra horizontal */
    align-items: center;     /* centra vertical */
    position: relative;
}

/* IMAGEN */
.hero img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 20px;
    object-fit: cover;
}

/* TEXTO (para que lo uses después) */
.texto {
    position: absolute;
    color: white;
    font-size: 40px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="hero">
    <img src="portada principal.jpeg" alt="Portada">

    <!-- AQUÍ PUEDES AGREGAR TEXTO -->
    <div class="texto">
        <!-- Escribe aquí -->
    </div>
</div>

</body>
</html>
