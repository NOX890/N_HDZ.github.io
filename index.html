<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV */
nav {
    background: #2e6b12;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
    cursor: pointer;
}

/* SECCIONES */
.section {
    display: none;
    padding: 40px;
}

.active {
    display: block;
}

/* PORTADA */
.hero {
    height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.hero img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 20px;
}

/* BOTÓN LOGIN */
.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <div>
        <a onclick="mostrar('inicio')">Inicio</a>
        <a onclick="mostrar('cultivos')">Cultivos</a>
        <a onclick="mostrar('recursos')">Recursos</a>
        <a onclick="mostrar('proveedores')">Proveedores</a>
    </div>

    <div id="nav-derecha">
        <a href="login.html" class="login-btn" id="btnSesion">Sesión</a>
    </div>
</nav>

<!-- PORTADA -->
<div id="inicio" class="section active hero">
    <img src="portada principal.jpeg">
</div>

<!-- PERFIL -->
<div id="perfil" class="section">
    <h2>Mi Perfil</h2>
    <p id="infoUsuario"></p>
    <button onclick="logout()">Cerrar sesión</button>
</div>

<!-- HUERTO -->
<div id="huerto" class="section">
    <h2>Mi Huerto</h2>
    <input id="planta" placeholder="Agregar cultivo">
    <button onclick="agregarPlanta()">Agregar</button>
    <ul id="listaPlantas"></ul>
</div>

<!-- CULTIVOS -->
<div id="cultivos" class="section">
    <h2>Cultivos</h2>
    <p>Información sobre cultivos 🌱</p>
</div>

<!-- RECURSOS -->
<div id="recursos" class="section">
    <h2>Recursos Sustentables</h2>
    <p>Uso eficiente ♻️</p>
</div>

<!-- PROVEEDORES -->
<div id="proveedores" class="section">
    <h2>Proveedores</h2>
    <p>Lista de proveedores 📄</p>
</div>

<script>
function mostrar(id) {
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* SESIÓN */
window.onload = function() {
    let user = localStorage.getItem("sesion");

    if(user) {
        document.getElementById("nav-derecha").innerHTML = `
            <a onclick="mostrar('perfil')">Mi Perfil</a>
            <a onclick="mostrar('huerto')">Mi Huerto</a>
        `;
        document.getElementById("infoUsuario").innerText = "Usuario: " + user;
    }
}

function logout() {
    localStorage.removeItem("sesion");
    location.reload();
}

/* HUERTO */
function agregarPlanta() {
    let planta = document.getElementById("planta").value;
    let lista = document.getElementById("listaPlantas");

    let item = document.createElement("li");
    item.textContent = planta;

    lista.appendChild(item);
}
</script>

</body>
</html>
