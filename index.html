<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV */
nav{
    background:#2e6b12;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-left{
    display:flex;
    align-items:center;
    gap:20px;
}

.logo{
    height:50px;
    cursor:pointer;
}

.logo-link{
    display:flex;
    align-items:center;
}

.menu-links{
    display:flex;
    gap:15px;
}

.menu-links a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

/* NAV RIGHT */
.nav-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
    cursor:pointer;
}

/* SECCIONES */
.section {
    display: none;
    padding: 40px;
}

.active {
    display: block;
}

/* HERO */
.hero {
    display: flex;
    justify-content: center;
}

.hero img {
    max-width: 90%;
    border-radius: 20px;
}

/* BOTONES */
.contenedor-botones {
    display: flex;
    justify-content: space-around;
    padding: 30px;
}

.card {
    width: 28%;
    cursor: pointer;
}

.card img {
    width: 100%;
    border-radius: 20px;
}

/* PERFIL DROPDOWN */
.perfil-container {
    position: relative;
}

.icono {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    background: #2e6b12;
    min-width: 160px;
    border-radius: 8px;
    overflow: hidden;
    z-index: 999;
}

.dropdown a {
    display:block;
    padding:10px;
    color:white;
    cursor:pointer;
}

/* PERFIL */
.perfil-hero {
    display:flex;
    height:80vh;
}

.perfil-texto {
    width:30%;
    background: rgba(13,107,47,0.85);
    padding:40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.perfil-texto h1 {
    color:yellow;
    font-size:50px;
}

.perfil-botones-texto {
    margin-top:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
}

.perfil-botones-texto img {
    width:180px;
    height:60px;
    object-fit:contain;
    cursor:pointer;
}

/* HUERTO */
.huerto-container{
    display:flex;
    height:80vh;
}

.huerto-izq{
    width:40%;
    background:#2e6b12;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
    gap:20px;
}

.huerto-logo{
    height:70px;
}

.huerto-botones{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.huerto-botones img{
    width:180px;
}

.huerto-der{
    width:60%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.cuadro-huerto{
    width:958px;
    height:637px;
    background:white;
    border-radius:10px;
}

/* EDITAR PERFIL */
.perfil-edit{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:80vh;
    gap:15px;
}

</style>
</head>

<body>

<nav>

<div class="nav-left">
    <a onclick="mostrar('inicio')" class="logo-link">
        <img src="logo.png" class="logo">
    </a>

    <div class="menu-links">
        <a onclick="mostrar('cultivos')">Cultivos</a>
        <a onclick="mostrar('recursos')">Recursos</a>
        <a onclick="mostrar('proveedores')">Proveedores</a>
    </div>
</div>

<div class="nav-right">

    <a href="login.html" id="btnSesion" class="login-btn">Sesión</a>

    <div id="perfilMenu" style="display:none;" class="perfil-container">
        <img src="perfil.png" class="icono" onclick="toggleMenu(event)">

        <div id="dropdownMenu" class="dropdown">
            <a onclick="mostrar('editarPerfil')">Editar perfil</a>
            <a onclick="mostrar('perfil')">Mi perfil</a>
            <a onclick="mostrar('huerto')">Mi huerto</a>
            <a onclick="logout()">Cerrar sesión</a>
        </div>
    </div>

</div>

</nav>

<!-- INICIO -->
<div id="inicio" class="section active">

    <div class="hero">
        <img src="portada principal.jpeg">
    </div>

</div>

<!-- PERFIL -->
<div id="perfil" class="section">

<div class="perfil-hero">

<div class="perfil-texto">
<h1>Bienvenida</h1>
<h2 id="nombreBienvenida"></h2>

<div class="perfil-botones-texto">
<img src="icono1.jpeg" onclick="mostrar('huerto')">
<img src="icono2.jpeg" onclick="mostrar('cultivos')">
<img src="icono3.jpeg" onclick="mostrar('proveedores')">
</div>

</div>

<div class="perfil-imagen">
<img src="perfil-fondo.jpeg">
</div>

</div>

</div>

<!-- HUERTO -->
<div id="huerto" class="section">

<div class="huerto-container">

<div class="huerto-izq">
<img src="logo.png" class="huerto-logo">

<div class="huerto-botones">
<img src="icono4.jpeg">
<img src="icono2.jpeg">
<img src="icono3.jpeg">
</div>
</div>

<div class="huerto-der">
<div class="cuadro-huerto"></div>
</div>

</div>

</div>

<div id="cultivos" class="section"><h2>Cultivos</h2></div>
<div id="recursos" class="section"><h2>Recursos</h2></div>
<div id="proveedores" class="section"><h2>Proveedores</h2></div>

<script>
window.mostrar = function(id){
    document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.getElementById("dropdownMenu").style.display="none";
};

window.toggleMenu = function(e){
    e.stopPropagation();
    let m=document.getElementById("dropdownMenu");
    m.style.display = (m.style.display==="block")?"none":"block";
};

document.addEventListener("click",()=>{
    document.getElementById("dropdownMenu").style.display="none";
});

/* 🔥 SESIÓN */
let user = localStorage.getItem("sesion");

if(user && user !== "null"){
    document.getElementById("btnSesion").style.display="none";
    document.getElementById("perfilMenu").style.display="inline-block";
    document.getElementById("nombreBienvenida").innerText=user;
}

window.logout=function(){
    localStorage.removeItem("sesion");
    location.reload();
};
</script>

</body>
</html>
