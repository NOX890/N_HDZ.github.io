<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV GENERAL AJUSTADO */
nav{
    background:#2e6b12;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* LADO IZQUIERDO */
.nav-left{
    display:flex;
    align-items:center;
    gap:20px;
}

/* LOGO */
.logo{
    height:50px;
    cursor:pointer;
}

.logo-link{
    display:flex;
    align-items:center;
}

/* LINKS DEL MENU */
.menu-links{
    display:flex;
    gap:15px;
}

.menu-links a{
    color:white;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
}

.menu-links a:hover{
    text-decoration:underline;
}

/* LADO DERECHO */
.nav-right{
    display:flex;
    align-items:center;
    gap:15px;
}

/* SECCIONES */
.section {
    display: none;
    padding: 40px;
}

.active {
    display: block;
}

/* PORTADA */
.hero {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.hero img {
    max-width: 90%;
    border-radius: 20px;
}

/* BOTONES INICIO */
.contenedor-botones {
    display: flex;
    justify-content: space-around;
    padding: 30px;
}

.card {
    width: 28%;
    cursor: pointer;
}

.card img {
    width: 100%;
    border-radius: 20px;
}

/* LOGIN */
.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
}

/* PERFIL MENU */
.perfil-container {
    position: relative;
}

.icono {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    background: #2e6b12;
}

.dropdown a {
    display: block;
    padding: 10px;
    color: white;
}

/* =========================
   PERFIL SPLIT
========================= */

.perfil-hero {
    display: flex;
    width: 100%;
    height: 80vh;
}

.perfil-texto {
    width: 30%;
    background: rgba(13, 107, 47, 0.85);
    padding: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.perfil-texto h1 {
    color: yellow;
    font-size: 50px;
}

.perfil-botones-texto {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

.perfil-botones-texto img {
    width: 180px;
    height: 60px;
    object-fit: contain;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    padding: 5px;
}

.perfil-botones-texto img:hover {
    transform: scale(1.05);
}

.perfil-imagen {
    width: 70%;
    height: 100%;
}

.perfil-imagen img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #0d6b2f;
}

/* EDITAR PERFIL */
.perfil-edit{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:80vh;
    gap:15px;
    text-align:center;
}

.perfil-edit input,
.perfil-edit select{
    width:250px;
    padding:10px;
    border-radius:10px;
    border:none;
}

.foto-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.foto-container img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
}

.estado{
    font-size:12px;
    opacity:0.8;
}

/* =========================
   🌱 MI HUERTO 40 / 60
========================= */

.huerto-container{
    display:flex;
    height:80vh;
}

/* IZQUIERDA */
.huerto-izq{
    width:40%;
    background:#2e6b12;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:20px;
    gap:20px;
}

.huerto-logo{
    height:70px;
}

.huerto-botones{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.huerto-botones img{
    width:180px;
    cursor:pointer;
    transition:0.3s;
}

.huerto-botones img:hover{
    transform:scale(1.05);
}

/* DERECHA */
.huerto-der{
    width:60%;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* CUADRO BLANCO RESPONSIVE */
.cuadro-huerto{
    width:90%;
    max-width:958px;
    height:637px;
    background:white;
    border-radius:10px;
}

</style>
</head>

<body>

<nav>
    <div class="nav-left">

        <a onclick="mostrar('inicio')" class="logo-link">
            <img src="logo.png" class="logo">
        </a>

        <div class="menu-links">
            <a onclick="mostrar('cultivos')">Cultivos</a>
            <a onclick="mostrar('recursos')">Recursos</a>
            <a onclick="mostrar('proveedores')">Proveedores</a>
        </div>

    </div>

    <div class="nav-right">

        <a href="login.html" id="btnSesion" class="login-btn">Sesión</a>

        <div id="perfilMenu" style="display:none;" class="perfil-container">
            <img src="perfil.png" class="icono" onclick="toggleMenu(event)">
            <div id="dropdownMenu" class="dropdown">
                <a onclick="mostrar('editarPerfil')">Editar perfil</a>
                <a onclick="mostrar('perfil')">Mi perfil</a>
                <a onclick="mostrar('huerto')">Mi huerto</a>
                <a onclick="logout()">Cerrar sesión</a>
            </div>
        </div>

    </div>
</nav>

<!-- INICIO -->
<div id="inicio" class="section active">

    <div class="hero">
        <img src="portada principal.jpeg">
    </div>

    <div class="contenedor-botones">
        <div class="card" onclick="mostrar('cultivos')">
            <img src="plantar.jpeg">
        </div>
        <div class="card" onclick="mostrar('recursos')">
            <img src="sustentable.jpeg">
        </div>
        <div class="card" onclick="mostrar('proveedores')">
            <img src="proveedores.jpeg">
        </div>
    </div>
</div>

<!-- MI HUERTO -->
<div id="huerto" class="section">

    <div class="huerto-container">

        <div class="huerto-izq">
            <img src="logo.png" class="huerto-logo">

            <div class="huerto-botones">
                <img src="btn1.png">
                <img src="btn2.png">
                <img src="btn3.png">
            </div>
        </div>

        <div class="huerto-der">
            <div class="cuadro-huerto"></div>
        </div>

    </div>

</div>

<!-- OTROS -->
<div id="cultivos" class="section"><h2>Cultivos</h2></div>
<div id="recursos" class="section"><h2>Recursos</h2></div>
<div id="proveedores" class="section"><h2>Proveedores</h2></div>

<script>
window.mostrar = function (id) {
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
};

window.toggleMenu = function (event) {
    event.stopPropagation();
    let m = document.getElementById("dropdownMenu");
    m.style.display = m.style.display === "block" ? "none" : "block";
};

window.logout = function () {
    localStorage.removeItem("sesion");
    location.reload();
};
</script>

</body>
</html>
