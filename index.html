<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV */
nav {
    background: #2e6b12;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
    cursor: pointer;
}

/* SECCIONES */
.section {
    display: none;
    padding: 40px;
}

.active {
    display: block;
}

/* PORTADA */
.hero {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.hero img {
    max-width: 100%;
    border-radius: 20px;
}

/* BOTONES */
.contenedor-botones {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 30px;
}

.card {
    width: 28%;
    position: relative;
    cursor: pointer;
    transition: 0.3s;
}

.card img {
    width: 100%;
    border-radius: 20px;
}

.texto-card {
    position: absolute;
    bottom: 15px;
    left: 15px;
    font-size: 18px;
    font-weight: bold;
    background: rgba(0,0,0,0.5);
    padding: 8px;
    border-radius: 10px;
}

.card:hover {
    transform: scale(1.05);
}

/* BOTÓN SESIÓN */
.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
}

/* PERFIL */
.perfil-container {
    position: relative;
    display: inline-block;
}

.icono {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
}

/* DROPDOWN */
.dropdown {
    display: none;
    position: absolute;
    right: 0;
    background: #2e6b12;
    border-radius: 10px;
    overflow: hidden;
}

.dropdown a {
    display: block;
    padding: 10px 20px;
    color: white;
}

.dropdown a:hover {
    background: #408A19;
}

/* FORM */
input {
    display: block;
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 10px 20px;
    background: #8DE35F;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<nav>
    <div>
        <a onclick="mostrar('inicio')">Inicio</a>
        <a onclick="mostrar('cultivos')">Cultivos</a>
        <a onclick="mostrar('recursos')">Recursos</a>
        <a onclick="mostrar('proveedores')">Proveedores</a>
    </div>

    <div>
        <a href="login.html" class="login-btn" id="btnSesion">Sesión</a>

        <div class="perfil-container" id="perfilMenu" style="display:none;">
            <img src="perfil.png" class="icono" onclick="toggleMenu()">

            <div class="dropdown" id="dropdownMenu">
                <a href="perfil.html">Mi perfil</a>
                <a onclick="mostrar('huerto')">Mi huerto</a>
                <a onclick="logout()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</nav>

<!-- INICIO -->
<div id="inicio" class="section active">

    <!-- IMAGEN -->
    <div class="hero">
        <img src="portada principal.jpeg">
    </div>

    <!-- BOTONES -->
    <div class="contenedor-botones">

        <div class="card" onclick="mostrar('cultivos')">
            <img src="plantar.jpeg">
        </div>

        <div class="card" onclick="mostrar('recursos')">
            <img src="sustentable.jpeg">
        </div>

        <div class="card" onclick="mostrar('proveedores')">
            <img src="proveedores.jpeg">
        </div>

    </div>

</div>

<!-- PERFIL -->
<div id="perfil" class="section">
    <h2>Mi Perfil</h2>
    <p id="infoUsuario"></p>
</div>

<!-- HUERTO -->
<div id="huerto" class="section">
    <h2>Mi Huerto</h2>
    <input id="planta" placeholder="Agregar cultivo">
    <button onclick="agregarPlanta()">Agregar</button>
    <ul id="listaPlantas"></ul>
</div>

<!-- CULTIVOS -->
<div id="cultivos" class="section">
    <h2>Cultivos</h2>
    <p>Información sobre cultivos 🌱</p>
</div>

<!-- RECURSOS -->
<div id="recursos" class="section">
    <h2>Recursos Sustentables</h2>
    <p>Uso eficiente ♻️</p>
</div>

<!-- PROVEEDORES -->
<div id="proveedores" class="section">
    <h2>Proveedores</h2>
    <p>Lista de proveedores 📄</p>
</div>

<script>
function mostrar(id) {
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* DROPDOWN */
function toggleMenu() {
    let menu = document.getElementById("dropdownMenu");
    menu.style.display = menu.style.display === "block" ? "none" : "block";
}

/* SESIÓN */
window.onload = function() {
    let user = localStorage.getItem("sesion");

    if(user) {
        document.getElementById("btnSesion").style.display = "none";
        document.getElementById("perfilMenu").style.display = "inline-block";
        document.getElementById("infoUsuario").innerText = "Usuario: " + user;
    }
}

function logout() {
    localStorage.removeItem("sesion");
    location.reload();
}

/* HUERTO */
function agregarPlanta() {
    let planta = document.getElementById("planta").value;

    let lista = document.getElementById("listaPlantas");
    let item = document.createElement("li");

    item.textContent = planta;
    lista.appendChild(item);
}
</script>

</body>
</html>
