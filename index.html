<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV */
nav {
    background: #2e6b12;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

nav a {
    color: white;
    margin: 10px;
    cursor: pointer;
    text-decoration: none;
}

/* SECCIONES */
.section {
    display: none;
    padding: 40px;
}

.active {
    display: block;
}

/* PORTADA */
.hero {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.hero img {
    max-width: 90%;
    border-radius: 20px;
}

/* BOTONES INICIO */
.contenedor-botones {
    display: flex;
    justify-content: space-around;
    padding: 30px;
}

.card {
    width: 28%;
    cursor: pointer;
}

.card img {
    width: 100%;
    border-radius: 20px;
}

/* LOGIN */
.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
}

/* PERFIL MENU */
.perfil-container {
    position: relative;
}

.icono {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    background: #2e6b12;
}

.dropdown a {
    display: block;
    padding: 10px;
    color: white;
}

/* =========================
   🔥 PERFIL NUEVO SPLIT
========================= */

.perfil-hero {
    display: flex;
    width: 100%;
    height: 80vh;
}

/* IZQUIERDA */
.perfil-texto {
    width: 30%;
    background: rgba(13, 107, 47, 0.85);
    padding: 40px;

    display: flex;
    flex-direction: column;
    justify-content: center;
}

.perfil-texto h1 {
    color: yellow;
    font-size: 50px;
}

/* BOTONES */
.perfil-botones-texto {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
}

.perfil-botones-texto img {
    width: 180px;
    height: 60px;
    object-fit: contain;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    padding: 5px;
}

.perfil-botones-texto img:hover {
    transform: scale(1.05);
}

/* DERECHA (IMAGEN) */
.perfil-imagen {
    width: 70%;
    height: 100%;
}

.perfil-imagen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

/* EDITAR PERFIL */
.perfil-edit{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:80vh;
    gap:15px;
    text-align:center;
}

.perfil-edit input,
.perfil-edit select{
    width:250px;
    padding:10px;
    border-radius:10px;
    border:none;
}

.foto-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.foto-container img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid white;
}

.estado{
    font-size:12px;
    opacity:0.8;
}

</style>
</head>

<body>

<nav>
    <div>
        <a onclick="mostrar('inicio')">Inicio</a>
        <a onclick="mostrar('cultivos')">Cultivos</a>
        <a onclick="mostrar('recursos')">Recursos</a>
        <a onclick="mostrar('proveedores')">Proveedores</a>
    </div>

    <div>
        <a href="login.html" id="btnSesion" class="login-btn">Sesión</a>

        <div id="perfilMenu" style="display:none;" class="perfil-container">
            <img src="perfil.png" class="icono" onclick="toggleMenu(event)">

            <div id="dropdownMenu" class="dropdown">
                <a onclick="mostrar('editarPerfil')">Editar perfil</a>
                <a onclick="mostrar('perfil')">Mi perfil</a>
                <a onclick="mostrar('huerto')">Mi huerto</a>
                <a onclick="logout()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</nav>

<!-- INICIO -->
<div id="inicio" class="section active">

    <div class="hero">
        <img src="portada principal.jpeg">
    </div>

    <div class="contenedor-botones">
        <div class="card" onclick="mostrar('cultivos')">
            <img src="plantar.jpeg">
        </div>
        <div class="card" onclick="mostrar('recursos')">
            <img src="sustentable.jpeg">
        </div>
        <div class="card" onclick="mostrar('proveedores')">
            <img src="proveedores.jpeg">
        </div>
    </div>
</div>

<!-- PERFIL -->
<div id="perfil" class="section">

    <div class="perfil-hero">

        <!-- IZQUIERDA -->
        <div class="perfil-texto">
            <h1>Bienvenida</h1>
            <h2 id="nombreBienvenida"></h2>

            <div class="perfil-botones-texto">
                <img src="icono1.jpeg" onclick="mostrar('huerto')">
                <img src="icono2.jpeg" onclick="mostrar('cultivos')">
                <img src="icono3.jpeg" onclick="mostrar('proveedores')">
            </div>
        </div>

        <!-- DERECHA -->
        <div class="perfil-imagen">
            <img src="perfil-fondo.jpeg">
        </div>

    </div>
</div>

<!-- SECCIONES -->
<div id="huerto" class="section"><h2>Mi Huerto</h2></div>
<div id="cultivos" class="section"><h2>Cultivos</h2></div>
<div id="recursos" class="section"><h2>Recursos</h2></div>
<div id="proveedores" class="section"><h2>Proveedores</h2></div>

<!-- EDITAR PERFIL -->
<div id="editarPerfil" class="section">
    <div class="perfil-edit">

        <h2>Editar perfil</h2>

        <div class="foto-container">
            <img id="fotoPreview" src="perfil.png">
            <input type="file" id="fotoInput">
        </div>

        <input type="text" id="nombreInput" placeholder="Nombre">

        <select id="zonaInput">
            <option value="">Zona climática 🌎</option>
            <option>Desértica 🌵</option>
            <option>Tropical 🌴</option>
            <option>Templada 🌿</option>
            <option>Fría ❄️</option>
        </select>

        <p class="estado">💾 Guardado automático</p>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

    window.mostrar = function (id) {
        document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        document.getElementById("dropdownMenu").style.display = "none";
    };

    window.toggleMenu = function (event) {
        event.stopPropagation();
        let m = document.getElementById("dropdownMenu");
        m.style.display = m.style.display === "block" ? "none" : "block";
    };

    document.addEventListener("click", () => {
        document.getElementById("dropdownMenu").style.display = "none";
    });

    let user = localStorage.getItem("sesion");

    if (user) {
        document.getElementById("btnSesion").style.display = "none";
        document.getElementById("perfilMenu").style.display = "inline-block";
        document.getElementById("nombreBienvenida").innerText = user;
    }

    window.logout = function () {
        localStorage.removeItem("sesion");
        location.reload();
    };

});
</script>

</body>
</html>
