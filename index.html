<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Siembra Seguro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .hero {
            height: 100vh;
            background: 
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                url("portada principal.jpeg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        h1 {
            font-size: 60px;
            color: #8DE35F;
        }

        p {
            margin-top: 15px;
            font-size: 20px;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 30px;
            background: #8DE35F;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #6fc94a;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div>
            <h1>🌱 Siembra Seguro</h1>
            <p>Cultiva con tecnología inteligente</p>
            <a href="#" class="btn">Explorar</a>
        </div>
    </section>

</body>
</html>
