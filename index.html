<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Siembra Seguro</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV */
nav {
    background: #2e6b12;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

nav a {
    color: white;
    margin: 10px;
    cursor: pointer;
    text-decoration: none;
}

/* SECCIONES */
.section {
    display: none;
    padding: 40px;
}

.active {
    display: block;
}

/* PORTADA */
.hero {
    display: flex;
    justify-content: center;
    padding: 20px;
}

.hero img {
    max-width: 90%;
    border-radius: 20px;
}

/* BOTONES */
.contenedor-botones {
    display: flex;
    justify-content: space-around;
    padding: 30px;
}

.card {
    width: 28%;
    position: relative;
    cursor: pointer;
}

.card img {
    width: 100%;
    border-radius: 20px;
}

.texto-card {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(0,0,0,0.5);
    padding: 5px;
    border-radius: 10px;
}

/* SESIÓN */
.login-btn {
    background: #8DE35F;
    padding: 10px 20px;
    border-radius: 20px;
}

/* PERFIL */
.perfil-container {
    position: relative;
}

.icono {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    background: #2e6b12;
}

.dropdown a {
    display: block;
    padding: 10px;
}

/* PERFIL FORM */
.perfil-box {
    text-align: center;
}

#fotoPerfil {
    width: 120px;
    height: 120px;
    border-radius: 50%;
}

/* INPUTS */
input, select {
    display: block;
    margin: 10px 0;
    padding: 10px;
    border-radius: 10px;
    border: none;
}

/* FILA PERFIL */
.fila-perfil {
    display: flex;
    align-items: end;
    gap: 20px;
}

/* BOTÓN GUARDAR */
.btn-guardar {
    height: 40px;
    margin-top: 20px;
    background: #8DE35F;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    padding: 0 15px;
}
</style>
</head>

<body>

<nav>
    <div>
        <a onclick="mostrar('inicio')">Inicio</a>
        <a onclick="mostrar('cultivos')">Cultivos</a>
        <a onclick="mostrar('recursos')">Recursos</a>
        <a onclick="mostrar('proveedores')">Proveedores</a>
    </div>

    <div>
        <a href="login.html" id="btnSesion" class="login-btn">Sesión</a>

        <div id="perfilMenu" style="display:none;" class="perfil-container">
            <img src="perfil.png" class="icono" onclick="toggleMenu()">

            <div id="dropdownMenu" class="dropdown">
                <a onclick="mostrar('perfil')">Mi perfil</a>
                <a onclick="mostrar('huerto')">Mi huerto</a>
                <a onclick="logout()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</nav>

<!-- INICIO -->
<div id="inicio" class="section active">
    <div class="hero">
        <img src="portada principal.jpeg">
    </div>

    <div class="contenedor-botones">
        <div class="card" onclick="mostrar('cultivos')">
            <img src="plantar.jpeg">
            <div class="texto-card">¿Qué puedo plantar?</div>
        </div>

        <div class="card" onclick="mostrar('recursos')">
            <img src="sustentable.jpeg">
            <div class="texto-card">Huerto sustentable</div>
        </div>

        <div class="card" onclick="mostrar('proveedores')">
            <img src="proveedores.jpeg">
            <div class="texto-card">Proveedores</div>
        </div>
    </div>
</div>

<!-- PERFIL -->
<div id="perfil" class="section">

    <h2>Mi Perfil</h2>

    <div class="perfil-box">
        <img src="perfil.png" id="fotoPerfil">
        <input type="file" onchange="cambiarFoto(event)">
    </div>

    <label>Nombre:</label>
    <input id="nombreUsuario">

    <div class="fila-perfil">
        <div>
            <label>Zona climática:</label>
            <select id="zonaUsuario">
                <option value="">Selecciona</option>
                <option value="arida">Árida</option>
                <option value="semiarida">Semiárida</option>
                <option value="templada">Templada</option>
                <option value="humeda">Húmeda</option>
                <option value="tropical">Tropical</option>
            </select>
        </div>

        <button onclick="guardarPerfil()" class="btn-guardar">Guardar</button>
    </div>

</div>

<!-- HUERTO -->
<div id="huerto" class="section">
    <h2>Mi Huerto</h2>
    <input id="planta">
    <button onclick="agregarPlanta()">Agregar</button>
    <ul id="listaPlantas"></ul>
</div>

<!-- CULTIVOS -->
<div id="cultivos" class="section">
    <h2>Cultivos</h2>
</div>

<!-- RECURSOS -->
<div id="recursos" class="section">
    <h2>Recursos</h2>
</div>

<!-- PROVEEDORES -->
<div id="proveedores" class="section">
    <h2>Proveedores</h2>
</div>

<script>
function mostrar(id) {
    document.querySelectorAll(".section").forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function toggleMenu() {
    let m = document.getElementById("dropdownMenu");
    m.style.display = m.style.display === "block" ? "none" : "block";
}

/* PERFIL */
function guardarPerfil() {
    localStorage.setItem("nombrePerfil", document.getElementById("nombreUsuario").value);
    localStorage.setItem("zonaPerfil", document.getElementById("zonaUsuario").value);
    alert("Perfil guardado");
}

function cambiarFoto(e) {
    let reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById("fotoPerfil").src = ev.target.result;
        localStorage.setItem("fotoPerfil", ev.target.result);
    }
    reader.readAsDataURL(e.target.files[0]);
}

/* SESIÓN */
window.onload = function() {
    let user = localStorage.getItem("sesion");

    if(user) {
        document.getElementById("btnSesion").style.display = "none";
        document.getElementById("perfilMenu").style.display = "inline-block";
    }

    let nombre = localStorage.getItem("nombrePerfil");
    if(nombre) document.getElementById("nombreUsuario").value = nombre;

    let zona = localStorage.getItem("zonaPerfil");
    if(zona) document.getElementById("zonaUsuario").value = zona;

    let foto = localStorage.getItem("fotoPerfil");
    if(foto) document.getElementById("fotoPerfil").src = foto;
}

function logout() {
    localStorage.removeItem("sesion");
    location.reload();
}

/* HUERTO */
function agregarPlanta() {
    let p = document.getElementById("planta").value;
    let li = document.createElement("li");
    li.textContent = p;
    document.getElementById("listaPlantas").appendChild(li);
}
</script>

</body>
</html>
