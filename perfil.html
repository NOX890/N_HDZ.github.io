<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Perfil</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #408A19;
    color: white;
}

/* NAV */
nav {
    background: #2e6b12;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: white;
    margin: 10px;
    text-decoration: none;
}

/* PERFIL */
.container {
    display: flex;
    height: calc(100vh - 70px);
}

/* BOTONES */
.menu {
    width: 250px;
    padding: 20px;
}

.boton {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #8DE35F;
    color: black;
    padding: 15px;
    border-radius: 15px;
    margin-bottom: 100px;
    cursor: pointer;
}

.boton img {
    width: 30px;
}

/* CONTENIDO */
.contenido {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.contenido img {
    max-width: 80%;
    border-radius: 20px;
}

/* ICONO PERFIL */
.perfil-container {
    position: relative;
}

.icono {
    width: 40px;
    border-radius: 50%;
    cursor: pointer;
}

.dropdown {
    display: none;
    position: absolute;
    right: 0;
    background: #2e6b12;
    border-radius: 10px;
}

.dropdown a {
    display: block;
    padding: 10px;
    color: white;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div>
        <a href="index.html">Inicio</a>
        <a href="index.html#cultivos">Cultivos</a>
        <a href="index.html#recursos">Recursos</a>
        <a href="index.html#proveedores">Proveedores</a>
    </div>

    <div>
        <div class="perfil-container">
            <img src="perfil.png" class="icono" onclick="toggleMenu()">

            <div class="dropdown" id="menu">
                <a href="perfil.html">Mi perfil</a>
                <a href="index.html#huerto">Mi huerto</a>
                <a onclick="logout()">Cerrar sesión</a>
            </div>
        </div>
    </div>
</nav>

<!-- CONTENIDO -->
<div class="container">

    <div class="menu">
        <div class="boton">
            <img src="icono1.png">
            <span>Datos</span>
        </div>

        <div class="boton">
            <img src="icono2.png">
            <span>Configuración</span>
        </div>

        <div class="boton" onclick="logout()">
            <img src="icono3.png">
            <span>Cerrar sesión</span>
        </div>
    </div>

    <div class="contenido">
        <img src="perfil-fondo.jpg">
    </div>

</div>

<script>
function toggleMenu() {
    let m = document.getElementById("menu");
    m.style.display = m.style.display === "block" ? "none" : "block";
}

function logout() {
    localStorage.removeItem("sesion");
    window.location.href = "index.html";
}
</script>

</body>
</html>
